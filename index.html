<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070706">
  <meta name="color-scheme" content="dark">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>The Seventh Silence — Pilot Chapter</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="is-locked">
  <noscript>
    <div class="no-script" role="alert">JavaScript is required to unlock this chapter.</div>
  </noscript>

  <main id="accessGate" class="gate" aria-labelledby="gateTitle">
    <div class="gate__grain" aria-hidden="true"></div>
    <div class="gate__frame" aria-hidden="true"></div>

    <section class="gate__content">
      <p class="eyebrow">Pilot Chapter</p>
      <h1 id="gateTitle" class="gate__title">
        <span>The Seventh</span>
        <span>Silence</span>
      </h1>

      <div class="sigil" aria-hidden="true"><span></span></div>
      <p class="gate__whisper">Only the invited may cross the threshold.</p>

      <form id="accessForm" class="access-form" novalidate>
        <label class="sr-only" for="passwordInput">Chapter password</label>
        <div class="password-control">
          <input
            id="passwordInput"
            name="chapter-password"
            type="password"
            inputmode="text"
            autocomplete="current-password"
            autocapitalize="none"
            autocorrect="off"
            spellcheck="false"
            placeholder="PASSWORD"
            aria-describedby="gateMessage"
            required
          >
          <button id="togglePassword" class="password-toggle" type="button" aria-label="Show password" aria-pressed="false">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path d="M2.8 12s3.2-5.2 9.2-5.2S21.2 12 21.2 12 18 17.2 12 17.2 2.8 12 2.8 12Z"/>
              <circle cx="12" cy="12" r="2.4"/>
            </svg>
          </button>
        </div>
        <p id="gateMessage" class="gate__message" aria-live="polite"></p>
        <button class="enter-button" type="submit">
          <span>Unseal</span>
          <span class="enter-button__line" aria-hidden="true"></span>
        </button>
      </form>

      <p class="credit">Mahrezign</p>
    </section>
  </main>

  <main id="reader" class="reader" aria-label="The Seventh Silence, Pilot Chapter" aria-hidden="true">
    <div id="progressTrack" class="progress" aria-hidden="true"><span id="progressBar"></span></div>
    <output id="pageIndicator" class="page-indicator" aria-live="off">1 / 40</output>

    <div id="chapter" class="chapter">
      <figure class="manga-sheet manga-sheet--cover" data-kind="cover">
        <img data-src="assets/pages/cover.png" width="1024" height="1536" alt="Cover — The Seventh Silence" fetchpriority="high" decoding="async">
        <figcaption class="image-status" aria-live="polite"></figcaption>
      </figure>

      <figure class="manga-sheet manga-sheet--separator" data-kind="separator">
        <img data-src="assets/pages/separator.png" width="1024" height="1536" alt="Separator page" fetchpriority="high" decoding="async">
        <figcaption class="image-status" aria-live="polite"></figcaption>
      </figure>

      <div class="pages" aria-label="Manga pages">
        <!-- Manga pages are inserted by app.js in a verified 01–40 sequence. -->
      </div>
    </div>

    <footer class="chapter-end">
      <div class="chapter-end__rule" aria-hidden="true"><span></span></div>
      <p>The Seventh Silence</p>
      <h2>End of Pilot Chapter</h2>
      <p class="credit">Mahrezign</p>
    </footer>
  </main>

  <script src="js/app.js" defer></script>
</body>
</html>
